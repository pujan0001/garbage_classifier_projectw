{% extends "base.html" %} {% block content %}
<section style="margin-top: 20px">
  <h2 style="margin-bottom: 15px">📊 Prediction Result</h2>

  <div
    style="
      background: #fefefe;
      padding: 20px 25px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      max-width: 600px;
    "
  >
    <p style="font-size: 1.1em">
      🗑️ The uploaded garbage was classified as:
      <strong style="color: #4caf50">{{ result }}</strong>
    </p>

    <p style="font-size: 1.05em">
      💰 Remaining tokens:
      <strong>{{ tokens }}</strong>
    </p>

    <a
      href="/"
      style="
        display: inline-block;
        margin-top: 20px;
        padding: 10px 16px;
        background-color: #2196f3;
        color: white;
        text-decoration: none;
        border-radius: 5px;
      "
    >
      🔁 Classify Another Image
    </a>
  </div>
</section>
{% endblock %}
