{% extends "base.html" %} {% block content %}
<section style="margin-top: 20px">
  <h2 style="margin-bottom: 15px">🖼️ Upload an Image for Classification</h2>

  {% if user %}
  <div
    style="
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      max-width: 500px;
    "
  >
    <form
      action="/predict"
      method="post"
      enctype="multipart/form-data"
      style="display: flex; flex-direction: column; gap: 15px"
    >
      <input
        type="file"
        name="file"
        required
        style="padding: 10px; border: 1px solid #ccc; border-radius: 4px"
      />
      <button
        type="submit"
        style="
          padding: 10px 20px;
          background-color: #4caf50;
          color: white;
          border: none;
          border-radius: 4px;
          cursor: pointer;
        "
      >
        🔍 Predict
      </button>
    </form>
  </div>
  {% else %}
  <div
    style="
      background: #fff3cd;
      padding: 15px 20px;
      border-left: 5px solid #ffc107;
      border-radius: 6px;
    "
  >
    <p>
      🔐 Please <a href="/login" style="color: #007bff">log in</a> to upload an
      image.
    </p>
  </div>
  {% endif %}
</section>
{% endblock %}
