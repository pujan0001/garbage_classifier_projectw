<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Garbage Classifier</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        background: #f9f9f9;
        color: #333;
      }

      .container {
        max-width: 960px;
        margin: 0 auto;
        padding: 20px;
      }

      header {
        background-color: #4caf50;
        color: white;
        padding: 20px 30px;
        border-radius: 8px;
        margin-bottom: 30px;
      }

      header h1 {
        margin: 0;
        font-size: 2em;
      }

      .user-info,
      .auth-links {
        margin-top: 10px;
        font-size: 0.95em;
      }

      .status {
        background-color: #e3f2fd;
        border-left: 5px solid #2196f3;
        padding: 10px 15px;
        border-radius: 4px;
        margin-top: 15px;
      }

      footer {
        text-align: center;
        font-size: 0.9em;
        color: #888;
        margin-top: 40px;
        padding: 10px 0;
      }

      a {
        color: #0066cc;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .content {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Garbage Classifier App</h1>
        {% if user %}
        <div class="user-info">
          Welcome <strong>{{ user.name }}</strong> | Email: {{ user.email }} |
          Tokens left: <strong>{{ tokens }}</strong> |
          <a href="/logout">Logout</a>
        </div>
        {% else %}
        <div class="auth-links">
          <a href="/login">Login with Google</a>
        </div>
        {% endif %} {% if aqi %}
        <div class="status">🌫️ Current AQI: <strong>{{ aqi }}</strong></div>
        {% endif %}
      </header>

      <div class="content">{% block content %}{% endblock %}</div>

      <footer>
        <p>&copy; 2025 Garbage Classifier App</p>
      </footer>
    </div>
  </body>
</html>
